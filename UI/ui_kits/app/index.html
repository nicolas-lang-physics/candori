<!-- @dsCard group="Candori App" viewport="420x820" name="Candori app" subtitle="The four MVP screens as an interactive click-through" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="LessonScreen.jsx"></script>
<script type="text/babel" src="WordAssociationScreen.jsx"></script>
<script type="text/babel" src="OneWordStoryScreen.jsx"></script>
<script type="text/babel" src="ReflectionScreen.jsx"></script>
<body style="margin:0;background:var(--surface-page)"><div id="root"></div>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('home');
  const S = { home: <window.HomeScreen onBegin={() => setScreen('lesson')} />,
    lesson: <window.LessonScreen onContinue={() => setScreen('assoc')} />,
    assoc: <window.WordAssociationScreen onContinue={() => setScreen('story')} />,
    story: <window.OneWordStoryScreen onContinue={() => setScreen('reflect')} />,
    reflect: <window.ReflectionScreen onDone={() => setScreen('home')} /> };
  const steps = ['home','lesson','assoc','story','reflect'];
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px 0',boxSizing:'border-box'}}>
      <div style={{width:'min(560px, 100vw)',height:'min(844px, calc(100vh - 80px))',background:'var(--surface-page)',border:'1px solid var(--hairline)',borderRadius:'min(28px, 3vw)',boxShadow:'var(--shadow-raised)',overflow:'hidden',display:'flex',flexDirection:'column'}} data-screen-label={screen}>
        <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',maxWidth:'34rem',width:'100%',margin:'0 auto',boxSizing:'border-box'}}>{S[screen]}</div>
      </div>
      <div style={{display:'flex',gap:8,marginTop:4}}>
        {steps.map(s => <button key={s} onClick={() => setScreen(s)} style={{font:'var(--type-meta)',letterSpacing:'var(--tracking-meta)',textTransform:'uppercase',color:s===screen?'var(--sage-deep)':'var(--text-meta)',background:'none',border:'none',cursor:'pointer',padding:'6px 8px'}}>{s}</button>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
