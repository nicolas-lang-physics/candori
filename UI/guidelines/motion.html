<!-- @dsCard group="Motion" viewport="700x180" name="Motion tokens" subtitle="One calm easing, no bounce — expressive motion lives only in the glow" -->
<link rel="stylesheet" href="../styles.css"><body style="margin:0;padding:20px 24px;background:var(--surface-page)"><style>@keyframes slide{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(180px)}}</style><div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:12px"><span style="font:var(--type-meta);color:var(--text-meta);width:110px">--dur-quick 180ms</span><div style="position:relative;width:220px;height:12px;background:var(--parchment-deep);border-radius:6px"><div style="position:absolute;width:40px;height:12px;border-radius:6px;background:var(--sage);animation:slide 1.4s var(--ease-calm) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:12px"><span style="font:var(--type-meta);color:var(--text-meta);width:110px">--dur-soft 360ms</span><div style="position:relative;width:220px;height:12px;background:var(--parchment-deep);border-radius:6px"><div style="position:absolute;width:40px;height:12px;border-radius:6px;background:var(--sage);animation:slide 2s var(--ease-calm) infinite alternate"></div></div></div><div style="display:flex;align-items:center;gap:12px"><span style="font:var(--type-meta);color:var(--text-meta);width:110px">--dur-glow 900ms</span><div style="position:relative;width:220px;height:12px;background:var(--parchment-deep);border-radius:6px"><div style="position:absolute;width:40px;height:12px;border-radius:6px;background:var(--sage);animation:slide 2.8s var(--ease-calm) infinite alternate"></div></div></div></div></body>
